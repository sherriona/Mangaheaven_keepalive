name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write-ping Supabase database
        run: |
          curl -sf -X PATCH "https://vxusdzckmakivxuamhxu.supabase.co/rest/v1/library?id=eq.-999999999" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"updated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Update heartbeat marker
        run: |
          mkdir -p .github
          date -u > .github/last-heartbeat.txt

      - name: Commit heartbeat marker
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .github/last-heartbeat.txt
          git commit -m "chore: keepalive ping" || echo "Nothing to commit"
          git push
